<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120a1f">
<meta name="mobile-web-app-capable" content="yes">
<title>ARKANWETT</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app" class="app">

  <!-- Gegner -->
  <header class="statusleiste statusleiste--gegner">
    <span class="avatar">🜏</span>
    <span class="name" id="gegner-name">Arkanmeister</span>
    <span class="wert wert--lp" id="gegner-lp"><i>♥</i><b>20</b></span>
    <span class="wert wert--chips" id="gegner-chips"><i>◈</i><b>20</b></span>
    <span class="wert wert--hand" id="gegner-hand"><i>🂠</i><b>5</b></span>
    <button class="ikon" id="btn-regeln" aria-label="Regeln">?</button>
  </header>

  <main class="brett">
    <section class="zone zone--gegner">
      <div class="reihe reihe--fallen" id="gegner-fallen"></div>
      <div class="reihe reihe--wesen" id="gegner-feld"></div>
      <div class="haende-band" id="gegner-haende"></div>
    </section>

    <section class="mitte" id="mitte">
      <div class="phasenband">
        <span class="runde" id="runden-anzeige">Runde 1</span>
        <span class="phase" id="phasen-anzeige">Einsatzphase</span>
        <span class="pot" id="pot-anzeige">Pot 0 ◈ · ×1</span>
      </div>
      <div class="ticker" id="ticker">Das Duell beginnt.</div>
      <div class="kampfbericht" id="kampfbericht" hidden></div>
    </section>

    <section class="zone zone--eigen">
      <div class="haende-band" id="eigen-haende"></div>
      <div class="reihe reihe--wesen" id="eigen-feld"></div>
      <div class="reihe reihe--fallen" id="eigen-fallen"></div>
    </section>
  </main>

  <!-- Spieler -->
  <footer class="unten">
    <div class="statusleiste statusleiste--eigen">
      <span class="avatar">🜂</span>
      <span class="name" id="eigen-name">Du</span>
      <span class="wert wert--lp" id="eigen-lp"><i>♥</i><b>20</b></span>
      <span class="wert wert--chips" id="eigen-chips"><i>◈</i><b>20</b></span>
      <span class="wert wert--deck" id="eigen-deck"><i>🂠</i><b>35</b></span>
      <button class="ikon" id="btn-log" aria-label="Chronik">☰</button>
    </div>

    <div class="hand" id="hand"></div>

    <div class="hinweis" id="hinweis" hidden></div>
    <div class="aktionen" id="aktionen"></div>
  </footer>
</div>

<div class="toast" id="toast" hidden></div>

<div class="overlay" id="overlay" hidden>
  <div class="blatt" id="blatt"></div>
</div>

<script src="js/elements.js"></script>
<script src="js/cards.js"></script>
<script src="js/hands.js"></script>
<script src="js/game.js"></script>
<script src="js/ai.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
<script>
// Offline-Betrieb nur im Web; unter file:// (Android-WebView) gibt es keine Service Worker.
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { /* Offline-Modus optional */ });
  });
}
</script>
</body>
</html>
