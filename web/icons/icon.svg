<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1350"/>
      <stop offset="1" stop-color="#0d0716"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5dfa0"/>
      <stop offset="1" stop-color="#a8873a"/>
    </linearGradient>
    <linearGradient id="karte" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2360"/>
      <stop offset="1" stop-color="#1b1030"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- hintere Karte -->
  <g transform="rotate(-16 256 280)">
    <rect x="150" y="130" width="150" height="210" rx="20" fill="url(#karte)" stroke="url(#gold)" stroke-width="6" opacity=".85"/>
  </g>
  <!-- vordere Karte -->
  <g transform="rotate(9 256 280)">
    <rect x="205" y="120" width="160" height="222" rx="22" fill="url(#karte)" stroke="url(#gold)" stroke-width="7"/>
    <path d="M285 165 l40 108 h-24 l-8-24h-32l-8 24h-24z m0 46 l-10 30h20z"
          fill="url(#gold)"/>
  </g>

  <!-- Energie-Chip -->
  <g transform="translate(340 356)">
    <circle r="58" fill="#1b1030" stroke="url(#gold)" stroke-width="10"/>
    <circle r="34" fill="none" stroke="url(#gold)" stroke-width="6" stroke-dasharray="16 12"/>
    <circle r="12" fill="url(#gold)"/>
  </g>
</svg>
