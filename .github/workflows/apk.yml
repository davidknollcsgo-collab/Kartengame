name: APK

# Godot braucht fuer den Android-Export das Android SDK, und dl.google.com ist
# aus der Entwicklungsumgebung heraus gesperrt. Der Bau gehoert deshalb
# hierher - auf dem Runner liegt das SDK bereits.

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "scripts/**"
      - "scenes/**"
      - "shaders/**"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/apk.yml"

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.5-stable"

jobs:
  apk:
    name: Debug-APK bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Godot und Exportvorlagen holen
        run: |
          set -euo pipefail
          V="${GODOT_VERSION}"
          curl -sSL --retry 3 -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${V}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          curl -sSL --retry 3 -o templates.tpz \
            "https://github.com/godotengine/godot-builds/releases/download/${V}/Godot_v${V}_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          unzip -q templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates "$HOME/.local/share/godot/export_templates/${V%-*}.stable"
          echo "--- Vorlagen ---"
          ls "$HOME/.local/share/godot/export_templates/${V%-*}.stable" | grep -i android || true

      # Debug-Schluessel. Nur zum Sideloaden - fuer den Play Store braucht es
      # einen eigenen, dauerhaft aufbewahrten Schluessel. Geht der verloren,
      # laesst sich die App nie wieder aktualisieren.
      - name: Debug-Schluessel erzeugen
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore "$HOME/debug.keystore" \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 -deststoretype pkcs12

      # Godot liest den SDK-Pfad aus den Editoreinstellungen, nicht aus der
      # Umgebung. Beide Dateinamen, weil Godot je nach Fassung den einen oder
      # den anderen sucht.
      - name: Editoreinstellungen schreiben
        run: |
          mkdir -p "$HOME/.config/godot"
          for datei in editor_settings-4.tres editor_settings-4.5.tres; do
            cat > "$HOME/.config/godot/$datei" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/shutdown_adb_on_exit = false
          export/android/force_system_user = false
          EOF
          done
          echo "SDK: ${ANDROID_SDK_ROOT}"
          echo "JDK: ${JAVA_HOME}"
          ls "${ANDROID_SDK_ROOT}/build-tools" | tail -3
          ls "${ANDROID_SDK_ROOT}/platforms" | tail -3

      # Baut die class_name-Registry auf. Ohne diesen Schritt findet der
      # Export die globalen Klassen nicht.
      - name: Projekt importieren
        run: godot --headless --import

      # --verbose, weil Godot im Headless-Betrieb sonst nur "configuration
      # errors" meldet und verschweigt, welcher. Raten kostet je Versuch einen
      # ganzen CI-Lauf.
      # Ohne `|| true` bricht die Standardshell (bash -e) am fehlgeschlagenen
      # Godot-Aufruf ab - und zwar **vor** der Fehlerauswertung. Zwei CI-Laeufe
      # lang habe ich deshalb geraten, statt die Meldung zu lesen.
      # Zwei Wege, ein Lauf. Der erste packt die mitgelieferte Vorlagen-APK um
      # und braucht kaum Werkzeug. Schlaegt er fehl, baut der zweite mit Gradle
      # aus den Quellen - langsamer, aber der Weg, den Godot selbst am besten
      # geprueft hat. Einzeln zu raten kostet je Versuch einen ganzen CI-Lauf.
      - name: APK bauen
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p build

          echo "::group::Editoreinstellungen"
          cat "$HOME/.config/godot/editor_settings-4.5.tres"
          ls -la "$HOME/debug.keystore"
          echo "::endgroup::"

          bauen () {
            godot --headless --verbose --export-debug "Android" build/nekton.apk \
              > export.log 2>&1 || true
            if [ -s build/nekton.apk ]; then return 0; fi
            echo "--- fehlgeschlagen, Auszug aus dem Protokoll ---"
            grep -inE "android|export|keystore|template|apk|error|gradle|java" export.log \
              | grep -viE "TextServer|Horipad|Nintendo|misc2|SDL|pen tablet" | tail -40
            return 1
          }

          echo "== Weg 1: mitgelieferte Vorlage =="
          if bauen; then echo "Weg 1 hat geklappt"; ls -la build/; exit 0; fi

          echo "== Weg 2: Gradle aus den Quellen =="
          # Genau das, was der Editor unter "Android-Build-Vorlage
          # installieren" tut: die Quellen ins Projekt legen und markieren,
          # damit Godot sie nicht als Spielinhalt einliest.
          V="${GODOT_VERSION}"
          mkdir -p android
          unzip -oq "$HOME/.local/share/godot/export_templates/${V%-*}.stable/android_source.zip" \
            -d android/build
          touch android/.gdignore
          echo "${V%-*}.stable" > android/build/.build_version
          sed -i 's|gradle_build/use_gradle_build=false|gradle_build/use_gradle_build=true|' \
            export_presets.cfg
          godot --headless --import > /dev/null 2>&1

          rm -f build/nekton.apk
          if bauen; then echo "Weg 2 hat geklappt"; ls -la build/; exit 0; fi

          echo "Beide Wege fehlgeschlagen."
          exit 1

      - name: APK pruefen
        run: |
          set -euo pipefail
          AAPT=$(ls "${ANDROID_SDK_ROOT}"/build-tools/*/aapt2 | tail -1)
          "$AAPT" dump badging build/nekton.apk | head -5
          unzip -l build/nekton.apk | tail -5

      - uses: actions/upload-artifact@v4
        with:
          name: nekton-apk
          path: build/nekton.apk
          if-no-files-found: error
