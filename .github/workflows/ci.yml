name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Push und pull_request feuern beide auf denselben Commit. Der Schlüssel muss
# deshalb der Commit selbst sein: github.ref und github.head_ref
# unterscheiden sich je Ereignistyp und ergaben zwei getrennte Gruppen, sodass
# weiterhin doppelt gebaut wurde.
concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.5-stable"

jobs:
  tests:
    name: Headless-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Godot aus dem Cache holen
        id: cache
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Godot installieren
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          V="${GODOT_VERSION}"
          # Nach /tmp, nicht neben das Projekt: der Lizenzpruefer meldet
          # jede Datei ohne Herkunftseintrag, und ein liegengelassenes
          # Bauarchiv ist fuer ihn nicht von einem eingeschleppten Asset zu
          # unterscheiden. Das soll es auch nicht sein.
          curl -sSL --retry 3 -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo mv "/tmp/godot/Godot_v${V}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

      - name: Version
        run: godot --headless --version

      # Baut die class_name-Registry auf. Ohne diesen Schritt findet der
      # Testlauf die globalen Klassen nicht.
      - name: Projekt importieren
        run: godot --headless --import

      - name: Tests
        run: godot --headless --path . --script tests/run_tests.gd

      # Der Unterschied zwischen "wir haben nichts kopiert" und "wir koennen
      # beweisen, dass wir nichts kopiert haben". Bei einer Beschwerde gegen
      # eine Play-Store-App zaehlt nur das Zweite.
      - name: Herkunft aller Dateien belegt
        run: godot --headless --path . --script tools/lizenzcheck.gd

      # Getrennter Schritt, weil der Prüfer je Welle spürbar Zeit braucht.
      # Bricht ab, sobald eine Sitzung mit dem Sollausbau fällt - also sobald
      # jemand feststecken würde, der nicht bezahlt hat.
      - name: Vier Umdrehungen durch den Graben prüfen
        run: godot --headless --path . --script tools/wellenpruefer.gd

      # Beantwortet, was man einem Aufbauspiel nicht ansieht: erreicht ein
      # normaler Spieler die Sollkurve, und entsteht dabei eine Wartemauer?
      - name: Kolonie über 120 Tage
        run: godot --headless --path . --script tools/kolonielauf.gd

      # **Der Testlauf allein beweist nicht, dass das Spiel läuft.** Er lädt
      # `rundlauf.gd`, `rund_hud.gd` und `kolonie_schirm.gd` nie - ein
      # `--script`-Lauf kennt keine Autoloads. Ein Parse-Fehler in einer
      # dieser Dateien bleibt dort grün, und das Spiel startet dann
      # *scheinbar*: kein Fehler im Bild, keine Ausgabe, nur ein Prozess, der
      # hängt. Der Startlauf findet es in Sekunden.
      #
      # Die Ausgabe muss dabei in eine Variable: `godot ... | grep ... | head`
      # gibt immer Erfolg zurück, weil `head` gelingt.
      - name: Startlauf
        run: |
          set -euo pipefail
          AUSGABE="$(godot --headless --path . --quit-after 150 2>&1 || true)"
          FEHLER="$(printf '%s\n' "$AUSGABE" | grep -E 'SCRIPT ERROR|ERROR:' || true)"
          if [ -n "$FEHLER" ]; then
            printf '%s\n' "$FEHLER"
            exit 1
          fi
          echo "Das Spiel startet sauber."

      # Die zweite Schleife hatte bis hierher keinen Wächter. Ein simulierter
      # Daumen ersetzt kein Fahrkönnen - was er ersetzt, ist das Raten: er
      # bricht ab, sobald eine Fahrt fällt oder eine Welle nicht leer wird,
      # und meldet damit eine untere Schranke. Vierzig Wellen kosten knapp
      # eine Minute.
      - name: Vierzig Wellen im Rundumlauf fahren
        run: godot --headless --path . -- --fahrprobe 40
