name: Veroeffentlichung

# Was hier herauskommt und warum es zwei Wege sind:
#
#   1. **Eine APK** als Anhang einer Vorabveroeffentlichung. Nicht als
#      Artefakt: ein Artefakt ist eine ZIP-Datei hinter einer Anmeldung, und
#      auf einem Telefon ist das keine Installation, sondern eine Bastelei.
#      Der Anhang einer Veroeffentlichung hat eine feste Adresse, die der
#      Browser des Telefons direkt herunterlaedt.
#   2. **Eine Seite zum Spielen im Browser** auf GitHub Pages. Zum Testen ist
#      das der kuerzere Weg als jede Installation - eine Adresse, dieselbe am
#      Rechner und am Telefon, und beim naechsten Bau ist sie aktuell.
#
# Godot braucht fuer den Android-Export das Android SDK, und dl.google.com ist
# aus der Entwicklungsumgebung heraus gesperrt. Der Bau gehoert deshalb
# hierher - auf dem Runner liegt das SDK bereits.

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "scripts/**"
      - "scenes/**"
      - "shaders/**"
      - "schriften/**"
      - "tests/**"
      - "tools/**"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/veroeffentlichung.yml"

concurrency:
  group: veroeffentlichung-${{ github.ref }}
  cancel-in-progress: true

# `contents: write` fuer die Veroeffentlichung, `pages`/`id-token` fuer die
# Seite. Mehr nicht - ein Bauauftrag braucht keine weiteren Rechte.
permissions:
  contents: write
  pages: write
  id-token: write

env:
  GODOT_VERSION: "4.5-stable"

jobs:
  bauen:
    name: Pruefen, Web und APK bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # **Alles nach /tmp, nichts ins Arbeitsverzeichnis.**
      #
      # Vorher landeten `godot.zip` und `templates.tpz` neben dem Projekt, und
      # der Lizenzpruefer meldete sie zu Recht als Dateien ohne Herkunfts-
      # eintrag - er unterscheidet nicht zwischen "fremdes Asset eingeschleppt"
      # und "Bauwerkzeug liegengelassen", und das soll er auch nicht.
      - name: Godot und Exportvorlagen holen
        run: |
          set -euo pipefail
          V="${GODOT_VERSION}"
          curl -sSL --retry 3 -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo mv "/tmp/godot/Godot_v${V}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          curl -sSL --retry 3 -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot-builds/releases/download/${V}/Godot_v${V}_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates "$HOME/.local/share/godot/export_templates/${V%-*}.stable"

      # Vor dem Bauen: laeuft das Spiel ueberhaupt?
      #
      # Der Testlauf allein reicht dafuer nicht. Er laedt `wache.gd`, `hud.gd`
      # und `kolonie_schirm.gd` nie, weil ein `--script`-Lauf keine Autoloads
      # kennt - ein Parse-Fehler in einer dieser Dateien blieb dort gruen und
      # kam als APK heraus, die beim Start nichts tut. Deshalb wird das Spiel
      # hier wirklich gestartet und die Ausgabe auf SCRIPT ERROR geprueft.
      - name: Tests und Startpruefung
        run: |
          set -euo pipefail
          godot --headless --import >/dev/null 2>&1 || true
          godot --headless --path . --script tests/run_tests.gd
          godot --headless --path . --script tools/lizenzcheck.gd

          AUSGABE="$(godot --headless --path . --quit-after 120 2>&1 || true)"
          echo "$AUSGABE" | tail -20
          if echo "$AUSGABE" | grep -q "SCRIPT ERROR"; then
            echo "::error::Das Spiel startet nicht sauber - siehe SCRIPT ERROR oben."
            exit 1
          fi

      - name: Web bauen
        run: |
          set -euo pipefail
          mkdir -p docs
          godot --headless --path . --export-release "Web" docs/index.html
          # GitHub Pages faehrt sonst Jekyll darueber und verschluckt alles,
          # was mit einem Unterstrich beginnt.
          touch docs/.nojekyll
          ls -la docs | head -20

      # Dieselbe Seite, aber in einer einzigen Datei: zum Weiterreichen, zum
      # Ablegen, zum Oeffnen ohne Server.
      - name: Einzeldatei packen
        run: |
          set -euo pipefail
          mkdir -p build
          python3 tools/einzeldatei.py build/nekton.html
          ls -la build/nekton.html

      # Debug-Schluessel. Nur zum Sideloaden - fuer den Play Store braucht es
      # einen eigenen, dauerhaft aufbewahrten Schluessel. Geht der verloren,
      # laesst sich die App nie wieder aktualisieren.
      - name: Debug-Schluessel erzeugen
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore "$HOME/debug.keystore" \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 -deststoretype pkcs12

      # **Reihenfolge ist hier alles.**
      #
      # `export/android/android_sdk_path` gehoert dem Android-Exportmodul und
      # wird erst angemeldet, wenn Godot dieses Modul geladen hat. Schreibt man
      # den Schluessel vorher von Hand in die Einstellungsdatei, kennt Godot ihn
      # beim Laden noch nicht und wirft ihn beim naechsten Sichern weg - der
      # SDK-Pfad ist danach leer.
      #
      # Sechs CI-Laeufe lang war das unsichtbar, weil Godot die Meldung dazu
      # verliert: `has_valid_project_configuration` ueberschreibt die
      # Fehlerzeile der vorigen Pruefung, statt sie zu ergaenzen. Uebrig bleibt
      # "configuration errors:" mit leerer Liste.
      - name: Editoreinstellungen anlegen und fuellen
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --import > /dev/null 2>&1 || true

          DATEI=$(ls "$HOME/.config/godot/"editor_settings-*.tres 2>/dev/null | head -1)
          test -n "$DATEI"

          setze () {
            if grep -q "^$1 = " "$DATEI"; then
              sed -i "s|^$1 = .*|$1 = $2|" "$DATEI"
            else
              printf '%s = %s\n' "$1" "$2" >> "$DATEI"
            fi
          }

          setze "export/android/android_sdk_path" "\"${ANDROID_SDK_ROOT}\""
          setze "export/android/java_sdk_path" "\"${JAVA_HOME}\""
          setze "export/android/debug_keystore" "\"${HOME}/debug.keystore\""
          setze "export/android/debug_keystore_user" "\"androiddebugkey\""
          setze "export/android/debug_keystore_pass" "\"android\""

          grep -n "export/android" "$DATEI"

      # --verbose, weil Godot im Headless-Betrieb sonst nur "configuration
      # errors" meldet und verschweigt, welcher. Raten kostet je Versuch einen
      # ganzen CI-Lauf. Ohne `|| true` bricht die Shell am fehlgeschlagenen
      # Godot-Aufruf ab - und zwar **vor** der Fehlerauswertung.
      - name: APK bauen
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/nekton.apk \
            > export.log 2>&1 || true
          if [ ! -s build/nekton.apk ]; then
            echo "--- fehlgeschlagen, Auszug aus dem Protokoll ---"
            grep -viE "TextServer|Horipad|Nintendo|misc2|SDL|pen tablet|Unrecognized" \
              export.log | tail -45
            exit 1
          fi
          ls -la build/

      - name: APK pruefen
        run: |
          set -euo pipefail
          AAPT=$(ls "${ANDROID_SDK_ROOT}"/build-tools/*/aapt2 | tail -1)
          "$AAPT" dump badging build/nekton.apk | head -5

      - name: Seite als Pages-Artefakt ablegen
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: APK und Einzeldatei ablegen
        uses: actions/upload-artifact@v4
        with:
          name: nekton
          path: |
            build/nekton.apk
            build/nekton.html
          if-no-files-found: error

  # Eine Vorabveroeffentlichung mit fester Marke. Sie wird bei jedem Bau
  # ueberschrieben, damit die Adresse dieselbe bleibt - wer sie sich einmal
  # auf dem Telefon gemerkt hat, bekommt dort immer den neuesten Stand.
  veroeffentlichen:
    name: Vorabveroeffentlichung aktualisieren
    needs: bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nekton
          path: build

      - name: Marke setzen und anhaengen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MARKE="test-$(echo '${{ github.ref_name }}' | tr '/' '-')"
          gh release delete "$MARKE" --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create "$MARKE" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "NEKTON - Teststand ${{ github.ref_name }}" \
            --prerelease \
            --notes "Automatisch gebaut aus \`${{ github.ref_name }}\` (${{ github.sha }}).

          * **nekton.apk** - auf dem Telefon oeffnen und installieren. Android fragt einmal nach der Erlaubnis, Apps aus dieser Quelle zu installieren.
          * **nekton.html** - dasselbe Spiel in einer einzigen Datei, im Browser zu oeffnen.

          Im Browser spielen geht auch ohne Download ueber die Seite dieses Repositorys." \
            build/nekton.apk build/nekton.html

  seite:
    name: Seite veroeffentlichen
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Pages einschalten, falls noch nicht geschehen
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: pages
        uses: actions/deploy-pages@v4
