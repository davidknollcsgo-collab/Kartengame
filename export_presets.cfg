# --- Der Ladestand fuer den Play Store ---
#
# **Play nimmt fuer neue Apps kein APK mehr an, sondern ein App Bundle.** Der
# Unterschied ist nicht nur die Endung: aus einem Bundle schneidet Google je
# Geraet ein eigenes APK, das nur die passende Architektur und Aufloesung
# enthaelt. Der Ladestand oben (`Android`) bleibt trotzdem, weil man ein
# Bundle nicht auf ein Telefon schieben kann - zum Ausprobieren braucht es
# weiter eine APK.
#
# **Drei Dinge unterscheiden diesen Satz vom Teststand:**
#
#   * `export_format=1` - App Bundle statt APK.
#   * `use_gradle_build=true` - ohne den eigenen Bau bleiben `min_sdk` und
#     `target_sdk` wirkungslos, und Play verlangt eine Mindestversion der
#     Ziel-API. Sie hier nicht zu setzen heisst, sie dem Zufall der gerade
#     eingebauten Vorlage zu ueberlassen.
#   * `runnable=false` - dieser Satz gehoert nicht in das Startmenue des
#     Editors; er wird nur vom Bauauftrag angefasst.
#
# **Der Schluessel steht hier bewusst nicht.** Ein Freigabeschluessel im
# Quelltext ist derselbe Fehler wie ein Passwort darin, nur folgenschwerer:
# wer ihn hat, kann Aktualisierungen unter deinem Namen veroeffentlichen. Der
# Bauauftrag schreibt ihn vor dem Export aus den Repository-Geheimnissen
# hinein - siehe `.github/workflows/veroeffentlichung.yml`. Und: **geht der
# Schluessel verloren, laesst sich die App nie wieder aktualisieren.** Play
# bietet dafuer die Schluesselverwaltung an; sie anzunehmen ist die
# vernuenftige Wahl.
[preset.2]

